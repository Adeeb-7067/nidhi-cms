components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── AUTH SCHEMAS ─────────────────────────────────────────────────────────
    LoginInput:
      type: object
      properties:
        identifier:
          type: string
          description: Email address or Employee ID
        password:
          type: string
      required: [identifier, password]

    RefreshTokenInput:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    ForgotPasswordInput:
      type: object
      properties:
        email:
          type: string
      required: [email]

    VerifyResetOtpInput:
      type: object
      properties:
        email:
          type: string
        otp:
          type: string
      required: [email, otp]

    ResetPasswordInput:
      type: object
      properties:
        email:
          type: string
        otp:
          type: string
        token:
          type: string
        newPassword:
          type: string
      required: [newPassword]

    FcmTokenInput:
      type: object
      properties:
        token:
          type: string
      required: [token]

    AuthResult:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [accessToken, refreshToken, user]

    # ── USER SCHEMAS ─────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        employeeId:
          type: ["string", "null"]
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, hr, manager, developer, tester, qa, client, freelancer, bde, finance, digital]
        subType:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        department:
          type: string
        phoneNumber:
          type: ["string", "null"]
        joiningDate:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, suspended]
        lastLoginAt:
          type: ["string", "null"]
        lastSeenAt:
          type: ["string", "null"]
        presenceStatus:
          type: string
          enum: [online, away, offline]
        isActiveNow:
          type: boolean
        lastActivityAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, name, email, role, status, createdAt]

    PresenceStatus:
      type: string
      enum: [online, away, offline]

    UserPresence:
      type: object
      properties:
        userId:
          type: integer
        status:
          $ref: "#/components/schemas/PresenceStatus"
        isActiveNow:
          type: boolean
        lastSeenAt:
          type: ["string", "null"]
        lastActivityAt:
          type: ["string", "null"]
      required: [userId, status, isActiveNow]

    PresenceMapResult:
      type: object
      properties:
        presence:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/UserPresence"
      required: [presence]

    UserInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [super_admin, hr, manager, developer, tester, qa, client, freelancer, bde, finance, digital]
        subType:
          type: string
        designation:
          type: string
        avatarUrl:
          type: string
        department:
