openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: Client Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: clients
    description: Client management
  - name: projects
    description: Project management
  - name: logs
    description: Daily work logs
  - name: bugs
    description: Bug tracking
  - name: tasks
    description: Work tasks and assignments
  - name: apk
    description: APK management
  - name: comments
    description: Comment threads
  - name: notifications
    description: Notifications
  - name: requests
    description: Resource requests
  - name: analytics
    description: Analytics and reporting
  - name: reports
    description: Report generation
  - name: settings
    description: System settings
  - name: tickets
    description: Support tickets
  - name: presence
    description: Real-time user presence

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email/password or employeeId/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset OTP by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: OTP sent if account exists

  /auth/verify-reset-otp:
    post:
      operationId: verifyResetOtp
      tags: [auth]
      summary: Verify password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyResetOtpInput"
      responses:
        "200":
          description: OTP valid

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using email OTP (or legacy token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset successful

  /auth/change-password/request-otp:
    post:
      operationId: requestChangePasswordOtp
      tags: [auth]
      summary: Send OTP to verify in-app password change
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OTP sent

  # ── TICKETS ───────────────────────────────────────────────────────────────
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List support tickets
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: audience
          in: query
          description: Filter by ticket audience (super_admin only). Omit or use `all` for every ticket.
          schema:
            type: string
            enum: [all, client, staff]
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResult"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a new ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /tickets/{id}:
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /auth/fcm-token:
    post:
      operationId: updateFcmToken
      tags: [auth]
      summary: Update the current user's FCM token for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FcmTokenInput"
      responses:
        "200":
          description: Token updated successfully

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMyProfile
      tags: [auth]
      summary: Update own profile (name, designation, avatarUrl)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ── USERS / EMPLOYEES ─────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: subType
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: staff
          in: query
          description: When "true" or "1", restrict to internal staff roles only.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResult"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Deactivate user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deactivated

  /presence:
    get:
      operationId: getPresence
      tags: [presence]
      summary: Bulk user presence (live + last seen)
      parameters:
        - name: ids
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated user IDs (max 200). Omit for all live users.
      responses:
        "200":
          description: Presence map keyed by user id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceMapResult"

  /presence/me:
    get:
      operationId: getMyPresence
      tags: [presence]
      summary: Current user presence
      responses:
        "200":
          description: Presence snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPresence"

  /presence/heartbeat:
    post:
      operationId: postPresenceHeartbeat
      tags: [presence]
      summary: Refresh activity timestamp (also sent via socket)
      responses:
        "200":
          description: Updated presence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPresence"

  /users/{id}/password:
    patch:
      operationId: resetUserPassword
      tags: [users]
      summary: Admin reset a user's password
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetInput"
      responses:
        "200":
          description: Password reset

  /users/{id}/credentials:
    get:
      operationId: getUserCredentials
      tags: [users]
      summary: Get credential history for a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Credential history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialHistory"

  /users/{id}/credentials/{credId}/reveal:
    post:
      operationId: revealCredential
      tags: [users]
      summary: Reveal decrypted password from credential history (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: credId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Decrypted password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRevealResult"

  /users/me/password:
    patch:
      operationId: changeMyPassword
      tags: [users]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed

  # ── CLIENTS ───────────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientListResult"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  # ── COMPANIES (same backing store as clients) ─────────────────────────────
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List all companies
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListResult"

  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get company by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/{id}/projects:
    get:
      operationId: listCompanyProjects
      tags: [companies]
      summary: List projects for a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  total:
                    type: integer

  /analytics/companies:
    get:
      operationId: getCompanyAnalytics
      tags: [analytics]
      summary: Company-level dashboard cards
      responses:
        "200":
          description: Company analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyAnalyticsResult"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  # ── PROJECTS ──────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects (filtered by role)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: clientId
          in: query
          schema:
            type: integer
        - name: companyId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [development, maintenance, digital]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResult"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete project (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project deleted

  /projects/{id}/members:
    get:
      operationId: getProjectMembers
      tags: [projects]
      summary: Get project team members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
    post:
      operationId: addProjectMember
      tags: [projects]
      summary: Add member to project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberInput"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"

  /projects/{id}/members/{userId}:
    patch:
      operationId: updateProjectMember
      tags: [projects]
      summary: Update project member (role on project)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subType]
              properties:
                subType:
                  type: string
                  nullable: true
                  description: Role on this project (e.g. Developer, Freelancer, Account Manager)
      responses:
        "200":
          description: Member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
    delete:
      operationId: removeProjectMember
      tags: [projects]
      summary: Remove member from project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member removed

  /projects/{id}/apk-schedules:
    get:
      operationId: getApkSchedules
      tags: [projects]
      summary: Get APK release schedules for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: APK schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApkSchedule"
    post:
      operationId: createApkSchedule
      tags: [projects]
      summary: Create APK release schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApkScheduleInput"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApkSchedule"

  /projects/{id}/milestones:
    get:
      operationId: getProjectMilestones
      tags: [projects]
      summary: Get project milestones
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Milestone"
    post:
      operationId: createMilestone
      tags: [projects]
      summary: Create a milestone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneInput"
      responses:
        "201":
          description: Milestone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"

  /projects/{id}/milestones/{milestoneId}:
    patch:
      operationId: updateMilestone
      tags: [projects]
      summary: Update a milestone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: milestoneId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdate"
      responses:
        "200":
          description: Milestone updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"

  /projects/{id}/history:
    get:
      operationId: getProjectHistory
      tags: [projects]
      summary: Get audit history for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # ── DAILY LOGS ────────────────────────────────────────────────────────────
  /projects/{id}/logs:
    get:
      operationId: getProjectLogs
      tags: [logs]
      summary: Get daily logs for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Daily logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogListResult"

  /logs/compliance-calendar:
    get:
      operationId: getLogComplianceCalendar
      tags: [logs]
      summary: Monthly daily-log compliance calendar for a developer
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: developerId
          in: query
          schema:
            type: integer
          description: Required for super_admin
      responses:
        "200":
          description: Compliance calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogComplianceCalendar"

  /logs/daily-summary:
    get:
      operationId: getDailyLogSummary
      tags: [logs]
      summary: Daily log hours summary vs required policy
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: developerId
          in: query
          schema:
            type: integer
          description: Super admin only — summary for another user
      responses:
        "200":
          description: Daily summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLogSummary"

  /logs:
    get:
      operationId: listMyLogs
      tags: [logs]
      summary: List daily logs (own logs for dev/QA; all team logs for super admin)
      parameters:
        - name: projectId
          in: query
          schema:
